<!doctype html>
<!-- Path: index.html -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b5bf0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z'/%3E%3Cpath d='M3.3 7 12 12l8.7-5M12 22V12'/%3E%3C/svg%3E">
<script>
/* Runs before the first paint: theme (no light flash), and "did we arrive by a slide?" (then no splash, slide in instead). */
(function () {
  var d = document.documentElement;
  try { d.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
  try {
    var n = sessionStorage.getItem('stash-nav'); sessionStorage.removeItem('stash-nav');
    if (n === 'fwd' || n === 'back') { d.classList.add('nosplash', 'enter-' + n); setTimeout(function () { d.classList.remove('enter-' + n); }, 700); }
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#f5f6f9; --panel:#ffffff; --ink:#14171f; --muted:#6a7384; --line:#e4e7ee;
  --accent:#5b5bf0; --accent-ink:#ffffff; --accent-soft:#ececfe; --danger:#e5484d;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.07); --radius:14px;
}
[data-theme=dark]{
  --bg:#0d0f14; --panel:#161920; --ink:#e8ebf2; --muted:#8a92a5; --line:#262a35;
  --accent:#8080ff; --accent-ink:#0d0f14; --accent-soft:#23254d; --danger:#ff6b70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- loading: splash (first open), thin busy bar (any request), spinner (waiting for content) ---- */
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes busy{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes spIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes spPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:18px;background:var(--bg);transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
.nosplash #splash{display:none}
.sp-logo{width:64px;height:64px;display:grid;place-items:center;border-radius:18px;color:var(--accent-ink);background:var(--accent);animation:spIn .45s ease both,spPulse 1.6s ease-in-out .45s infinite}
.sp-logo svg{width:34px;height:34px}
.sp-bar{width:120px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;position:relative;animation:show .45s ease both}
.sp-bar i,#busy i{position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--accent);border-radius:3px;animation:busy 1.1s ease-in-out infinite}
#busy{position:fixed;left:0;right:0;top:0;height:3px;z-index:95;overflow:hidden;opacity:0;transition:opacity .3s;pointer-events:none}
#busy.on{opacity:1}
.loading{display:grid;place-items:center;padding:60px 20px;opacity:0;animation:show .3s .15s both}
.loading i{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.fadein{animation:show .25s}

/* ---- slide transitions between pages: the page wrapper moves (see the script) ---- */
@keyframes inLeft{from{transform:translateX(-24%)}to{transform:none}}
@keyframes outLeft{to{transform:translateX(-24%)}}
.enter-back #page{animation:inLeft .26s cubic-bezier(.2,.8,.2,1)}
.leave-fwd #page{animation:outLeft .2s ease-in forwards}
/* only transform is animated (no opacity: a faded full-screen layer is costly on a weak GPU), and the layer is promoted up front */
.enter-back #page,.leave-fwd #page{will-change:transform}
/* the blurred header is very costly to repaint while the whole page moves: drop the blur during a slide */
.enter-back header.top,.leave-fwd header.top{backdrop-filter:none;background:var(--bg)}

/* kinds */
.k-image{--k:#e5589a}.k-video{--k:#8b5cf6}.k-audio{--k:#f59e0b}.k-doc{--k:#3b82f6}
.k-data{--k:#10b981}.k-archive{--k:#f97316}.k-code{--k:#06b6d4}.k-other{--k:#8a92a5}
.tile{display:grid;place-items:center;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);border-radius:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn.icon{padding:8px;border-radius:10px}
a.btn{color:inherit;text-decoration:none}
.btn.sm{padding:5px 10px;font-size:13px}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:10px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* header */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px clamp(14px,4vw,32px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand .tile{width:34px;height:34px;--k:var(--accent)}
.search{flex:1;max-width:520px;margin:0 auto;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px;border-radius:999px;background:var(--panel)}
.hactions{display:flex;gap:6px;align-items:center}

main{max-width:1180px;margin:0 auto;padding:22px clamp(14px,4vw,32px) 120px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .l{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;min-width:2px;transition:width .4s}

/* dropzone */
.drop{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-align:center;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--panel));border-radius:var(--radius);padding:26px 18px;margin-bottom:22px;cursor:pointer;transition:.15s}
.drop:hover{background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.drop .tile{width:46px;height:46px;--k:var(--accent)}
.drop b{display:block;font-size:16px}
.drop span{color:var(--muted);font-size:13.5px}
.dragover{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
.dragover.on{display:grid;animation:show .15s}
.dragover div{border:3px dashed var(--accent);border-radius:24px;padding:60px 70px;font-size:22px;font-weight:700;color:var(--accent);background:var(--panel);box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip small{color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.8}
select.btn{padding-right:10px;appearance:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 10px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.bulk{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:14px;background:var(--accent-soft);border-radius:12px;flex-wrap:wrap}
.bulk b{margin-right:auto}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card.sel{outline:2px solid var(--accent);outline-offset:-2px}
.thumb{height:130px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 10%,var(--panel));color:var(--k);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg.i{width:44px;height:44px;stroke-width:1.6}
.ext{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--panel);color:var(--k);padding:2px 7px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.card .meta{padding:10px 12px 12px}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.pick{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:7px;border:2px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;opacity:0;transition:.12s}
.card:hover .pick,.card.sel .pick,.sel-mode .pick{opacity:1}
.card.sel .pick,.row.sel .pick{background:var(--accent);border-color:var(--accent)}
.pick svg{width:14px;height:14px;opacity:0;stroke-width:3}
.sel .pick svg{opacity:1}

/* list */
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) 90px 110px 150px 96px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.row.sel{background:var(--accent-soft)}
.row.head{cursor:default;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;background:color-mix(in srgb,var(--ink) 3%,transparent)}
.row.head:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.row .pick{position:static;opacity:1;border-color:var(--line);background:transparent;color:#fff}
.row .nm{display:flex;gap:10px;align-items:center;min-width:0}
.row .nm .tile{width:34px;height:34px;flex:none}
.row .c{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nmt{min-width:0}
.row .sub.m{display:none;margin-top:0}
.row .acts{display:flex;justify-content:flex-end;gap:2px}

.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .tile{width:64px;height:64px;margin:0 auto 14px;--k:var(--accent)}
.empty .tile svg{width:30px;height:30px}
.empty h3{margin:0 0 4px;color:var(--ink)}

/* uploads panel */
.uploads{position:fixed;right:16px;bottom:16px;z-index:40;width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.uploads header{display:flex;align-items:center;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.uploads header span{flex:1}
.ujobs{max-height:300px;overflow:auto}
.job{padding:10px 14px;border-top:1px solid var(--line)}
.job:first-child{border-top:0}
.job .t{display:flex;gap:8px;align-items:center}
.job .t .name{flex:1;font-weight:500;font-size:14px}
.job .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.job.err .s{color:var(--danger)}
.job.done .bar>i{background:#10b981}

/* dialogs */
dialog{border:0;padding:0;background:var(--panel);color:var(--ink);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,10,16,.6);backdrop-filter:blur(3px)}
#dlg{width:min(420px,calc(100vw - 32px))}
.dlg-body{padding:22px;display:grid;gap:12px}
.dlg-body h3{margin:0}
.dlg-body p{margin:0;color:var(--muted)}
.dlg-body .end{display:flex;flex-direction:row-reverse;gap:8px;justify-content:flex-start;margin-top:4px}
#viewer{width:min(1180px,calc(100vw - 24px));height:min(780px,calc(100vh - 24px));overflow:hidden}
#viewer[open]{display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.vbar .name{flex:1;font-size:16px}
.vbody{flex:1;display:flex;min-height:0}
.stage{flex:1;min-width:0;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 5%,var(--panel));overflow:auto;position:relative}
.stage img,.stage video{max-width:100%;max-height:100%;display:block}
.stage iframe{width:100%;height:100%;border:0;background:#fff}
.stage pre{margin:0;padding:18px;width:100%;height:100%;overflow:auto;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;align-self:start}
.stage .tbl{width:100%;height:100%;overflow:auto;align-self:start}
.tbl table{border-collapse:collapse;font-size:13px;width:max-content;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 10px;text-align:left;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--panel)}
.tbl td:first-child,.tbl th:first-child{color:var(--muted);background:var(--panel);position:sticky;left:0}
.noprev{text-align:center;color:var(--muted);padding:30px}
.noprev .tile{width:84px;height:84px;margin:0 auto 14px}
.noprev .tile svg{width:38px;height:38px}
.note{position:absolute;left:12px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.info{width:300px;flex:none;border-left:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.info dl{margin:0;display:grid;gap:10px}
.info dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.info dd{margin:2px 0 0;word-break:break-all}
.mono{font:12px ui-monospace,Menlo,Consolas,monospace;cursor:copy}
.info .btns{display:grid;gap:8px;margin-top:auto}
.info .btns .btn{justify-content:center}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:var(--panel);box-shadow:var(--shadow);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);cursor:pointer}
.navbtn.l{left:12px}.navbtn.r{right:12px}

/* login */
#login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--bg);padding:16px}
.lcard{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px;display:grid;gap:14px;text-align:center}
.lcard .tile{width:56px;height:56px;margin:0 auto;--k:var(--accent)}
.lcard h2{margin:0}
.lcard p{margin:0;color:var(--muted)}
.err-t{color:var(--danger);font-size:13.5px;min-height:1.2em}

/* toasts */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);animation:pop .2s}
.toast.err{background:var(--danger);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}

@media (max-width:820px){
  .row{grid-template-columns:28px minmax(0,1fr) 80px 90px}
  .row .c.type,.row .c.when{display:none}
  .row.head .c.type,.row.head .c.when{display:none}
  .info{display:none}
  header.top{flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .brand span{display:none}
  .hactions{margin-left:auto}
}

/* ---- phone layout ----
   Everything below only applies on a phone (narrow screen, or a phone turned sideways). The desktop page is unchanged.
   Phone-only controls carry the class "ph" and stay hidden elsewhere. */
.ph,.statline,.uprog,#chatsBtn .lbl{display:none}
#menuShade{position:fixed;inset:0;z-index:65}
#menu{position:fixed;z-index:70;min-width:220px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;display:grid;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#menu button{display:flex;gap:12px;align-items:center;text-align:left;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;cursor:pointer}
#menu button:active{background:color-mix(in srgb,var(--ink) 10%,transparent)}
#menu button.on{color:var(--accent);font-weight:600}
#menu .chk{margin-left:auto}
#menu .hd{padding:10px 12px 2px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (pointer:coarse){ .drop{display:none} }
@media (max-width:640px), (max-height:480px) and (pointer:coarse){
  html{-webkit-text-size-adjust:100%}
  .ph{display:inline-flex}
  .btn{min-height:44px}
  .btn.icon{min-width:44px;justify-content:center}
  .btn.sm{min-height:40px}
  .field{font-size:16px}

  /* top bar: one slim row. Chats first (it is what is used most), then search, then the rest in a menu */
  header.top{background:var(--bg);backdrop-filter:none;flex-wrap:nowrap;gap:6px;padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left))}
  .brand{gap:8px;font-size:17px}
  .brand span{display:inline}
  .search{display:none;margin:0;max-width:none}
  header.top.searching .search{display:block;flex:1}
  header.top.searching .brand,header.top.searching .hactions{display:none}
  header.top:not(.searching) #searchX{display:none}
  .hactions{margin-left:auto;gap:2px}
  #appBtn,#theme,#logout,#uploadBtn{display:none}
  #chatsBtn{width:auto;padding:0 14px;gap:8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  #chatsBtn .lbl{display:inline}
  #moreBtn svg{stroke-width:3.4}

  main{padding:10px max(10px,env(safe-area-inset-right)) 150px max(10px,env(safe-area-inset-left))}

  /* storage: a line, not three cards */
  .stats{display:block;margin-bottom:6px}
  .stat{display:none}
  .statline{display:block;margin:0 2px 8px;color:var(--muted);font-size:13px}

  /* filters scroll sideways; sort, WhatsApp filter and grid/list live behind one button */
  .toolbar{flex-wrap:nowrap;gap:8px;margin-bottom:10px}
  .chips{flex-wrap:nowrap;overflow-x:auto;min-width:0;padding:2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:38px;padding:6px 14px;font-size:14px}
  #sort,#srcSel,.seg{display:none}
  #viewBtn{flex:none}

  /* files: no hover on a touch screen; a long press selects */
  #files{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:3px}
  .card{border:0;border-radius:8px}
  .card:hover{transform:none;box-shadow:none}
  .thumb{height:auto;aspect-ratio:1/1}
  .thumb svg.i{width:34px;height:34px}
  .card .meta{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff}
  .card .name{font-size:11.5px;font-weight:500}
  .card .sub{display:none}
  .card.k-image:not(.ni) .meta,.card.k-image:not(.ni) .ext{display:none}

async function refresh(hold){
  try {
    const d = await api('/api/files');
    if (hold) await hold; // the list is built after a slide has finished
    files = d.files; stats = d.stats;
    for (const id of [...selected]) if (!files.some(f => f.id === id)) selected.delete(id);
    render();
  } catch (e) { if (e.message !== 'Login required') toast(e.message,'err'); }
}
let refreshTimer;
const scheduleRefresh = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 350); };

/* ---------- derived list ---------- */
const isWa = f => f.source === 'whatsapp';
/* the files that pass the WhatsApp filter (everything when the filter is off or there is nothing to filter) */
function pool(){
  if (!hasWa || srcMode === 'all') return files;
  return files.filter(f => srcMode === 'wa' ? isWa(f) : !isWa(f));
}
function visible(){
  const q = query.trim().toLowerCase();
  let out = pool().filter(f => (filter==='all' || kindOf(f)===filter) && (!q || f.name.toLowerCase().includes(q) || f.mime.toLowerCase().includes(q)));
  const by = {
    new:(a,b)=>b.created-a.created, old:(a,b)=>a.created-b.created,
    az:(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}), za:(a,b)=>b.name.localeCompare(a.name,undefined,{numeric:true}),
    big:(a,b)=>b.size-a.size, small:(a,b)=>a.size-b.size
  };
  return out.sort(by[sortBy] || by.new);
}

/* ---------- rendering ---------- */
function render(){
  hasWa = files.some(isWa);
  renderStats(); renderSrc(); renderChips(); renderBulk(); renderFiles();
  if (firstPaint) { firstPaint = false; for (const id of ['#stats','#files']) { const e = $(id); e.classList.remove('fadein'); void e.offsetWidth; e.classList.add('fadein'); } } // first content fades in
}

function renderStats(){
  if (!stats) return;
  const pct = Math.max(0.5, stats.bytes / Math.max(1, stats.bytes + stats.free) * 100);
  $('#stats').replaceChildren(
    h('div',{class:'statline',text:stats.count+' file'+(stats.count===1?'':'s')+' · '+fmtBytes(stats.bytes)+' stored · '+fmtBytes(stats.free)+' free'}),
    h('div',{class:'stat'}, h('div',{class:'l',text:'Files'}), h('div',{class:'v',text:String(stats.count)})),
    h('div',{class:'stat'}, h('div',{class:'l',text:'Stored'}), h('div',{class:'v',text:fmtBytes(stats.bytes)})),
    h('div',{class:'stat'}, h('div',{class:'l',text:'Server disk free'}), h('div',{class:'v',text:fmtBytes(stats.free)}),
      h('div',{class:'bar'}, h('i',{style:'width:'+pct+'%'})))
  );
}

function renderSrc(){
  const s = $('#srcSel');
  s.hidden = !hasWa;
  s.value = srcMode;
}
function setSrc(v){
  srcMode = v; store.set('src', v);
  render();
}
function renderChips(){
  const shown = pool(), counts = {all: shown.length};
  for (const f of shown) { const k = kindOf(f); counts[k] = (counts[k]||0)+1; }
  if (filter !== 'all' && !counts[filter]) filter = 'all';
  $('#chips').replaceChildren(...KINDS.filter(([k]) => k==='all' || counts[k]).map(([k,label]) =>
    h('button',{class:'chip'+(filter===k?' on':''), onclick:()=>{ filter=k; render(); }}, label, h('small',{text:String(counts[k]||0)}))));
}

function renderBulk(){
  const b = $('#bulk');
  b.hidden = selected.size === 0;
  if (b.hidden) return;
  const vis = visible();
  b.replaceChildren(
    h('b',{text: selected.size + ' selected'}),
    h('button',{class:'btn sm',onclick:()=>{ vis.forEach(f=>selected.add(f.id)); render(); }, text: PHONE.matches ? 'All' : 'Select all shown'}),
    h('button',{class:'btn sm',onclick:()=>downloadZip([...selected]), title:'Download as .zip','aria-label':'Download as .zip'}, ic('download'), PHONE.matches ? null : 'Download .zip'),
    h('button',{class:'btn sm danger',onclick:bulkDelete,'aria-label':'Delete'}, ic('trash'), PHONE.matches ? null : 'Delete'),
    h('button',{class:'btn sm ghost',onclick:()=>{ selected.clear(); render(); },'aria-label':'Clear selection'}, PHONE.matches ? ic('x') : 'Clear')
  );
}

function toggleSel(id, ev){
  ev && ev.stopPropagation();
  const on = !selected.has(id);
  on ? selected.add(id) : selected.delete(id);
  /* only the tapped tile changes: redrawing the whole grid on every tap is slow, and would drop the finger's tile mid-press */
  for (const e of $('#files').querySelectorAll('[data-id]')) if (e.dataset.id === id) e.classList.toggle('sel', on);
  const hd = $('#files .row.head');
  if (hd) hd.classList.toggle('sel', visible().every(f => selected.has(f.id)));
  renderBulk();
}

function thumb(f, big){
  const k = kindOf(f);
  if (k==='image' && f.size < 8*1024*1024 && f.mime !== 'image/heic' && !f.mime.includes('tiff')) {
    const img = h('img',{loading:'lazy',decoding:'async',alt:'',src:rawUrl(f)});
    img.onload = () => img.classList.add('ld'); // fades in once it has loaded
    img.onerror = () => { const c = img.closest('.card'); if (c) c.classList.add('ni'); img.replaceWith(ic(k)); };
    return img;
  }
  return ic(k);
}

function renderFiles(){
  const list = visible(), root = $('#files');
  $('#vGrid').classList.toggle('on', view==='grid');
  $('#vList').classList.toggle('on', view==='list');
  if (!list.length) {
    root.replaceChildren(h('div',{class:'empty'},
      h('div',{class:'tile'}, ic(files.length ? 'search' : 'box')),
      h('h3',{text: files.length ? 'Nothing matches' : 'Your vault is empty'}),
      h('div',{text: files.length ? 'Try a different search or filter.' : (PHONE.matches ? 'Tap the + button to upload files.' : 'Drop some files above to get started.')})));
    return;
  }
  if (view === 'grid') {
    root.replaceChildren(h('div',{class:'grid'}, list.map((f,i) => {
      const k = kindOf(f), sel = selected.has(f.id), th = thumb(f);
      return h('div',{class:'card k-'+k+(sel?' sel':'')+(th.tagName==='IMG'?'':' ni'), 'data-id':f.id, onclick:()=> PHONE.matches && selected.size ? toggleSel(f.id) : openViewer(list,i)},
        h('div',{class:'thumb'}, th),
        extOf(f.name) ? h('span',{class:'ext',text:extOf(f.name).slice(0,5)}) : null,
        h('div',{class:'pick',onclick:e=>toggleSel(f.id,e)}, ic('check')),
        h('div',{class:'meta'}, h('div',{class:'name',title:f.name,text:f.name}),
          h('div',{class:'sub',text:fmtBytes(f.size)+' · '+fmtWhen(f.created)})));
    })));
  } else {
    const allSel = list.every(f => selected.has(f.id));
    const head = h('div',{class:'row head'},
      h('div',{class:'pick',title:'Select all',onclick:()=>{ list.forEach(f => allSel ? selected.delete(f.id) : selected.add(f.id)); render(); }}, ic('check')),
      h('div',{text:'Name'}), h('div',{class:'c',text:'Size'}), h('div',{class:'c type',text:'Type'}),
      h('div',{class:'c when',text:'Uploaded'}), h('div'));
    if (allSel) head.classList.add('sel');
    root.replaceChildren(h('div',{class:'list'}, head, list.map((f,i) => {
      const k = kindOf(f), sel = selected.has(f.id);
      return h('div',{class:'row k-'+k+(sel?' sel':''), 'data-id':f.id, onclick:()=> PHONE.matches && selected.size ? toggleSel(f.id) : openViewer(list,i)},
        h('div',{class:'pick',onclick:e=>toggleSel(f.id,e)}, ic('check')),
        h('div',{class:'nm'}, h('div',{class:'tile'}, ic(k)),
          h('div',{class:'nmt'}, h('div',{class:'name',title:f.name,text:f.name}), h('div',{class:'sub m',text:fmtBytes(f.size)+' · '+fmtWhen(f.created)}))),
        h('div',{class:'c',text:fmtBytes(f.size)}),
        h('div',{class:'c type',text:(extOf(f.name)||'file').toUpperCase()}),
        h('div',{class:'c when',title:fmtFull(f.created),text:fmtWhen(f.created)}),
        h('div',{class:'acts'},
          h('button',{class:'btn ghost icon sm',title:'Download',onclick:e=>{ e.stopPropagation(); download(f); }}, ic('download')),
          h('button',{class:'btn ghost icon sm',title:'Delete',onclick:e=>{ e.stopPropagation(); removeFiles([f]); }}, ic('trash'))));
    })));
  }
}

/* ---------- actions ---------- */
function download(f){ const a = h('a',{href:dlUrl(f),download:f.name}); document.body.append(a); a.click(); a.remove(); }
function downloadZip(ids){
  if (window.StashApp && StashApp.downloadZip) { StashApp.downloadZip(ids.join(',')); return; }  // Android app
  const form = h('form',{method:'post',action:'/api/zip',target:'dl',style:'display:none'}, h('input',{type:'hidden',name:'ids',value:ids.join(',')}));
  document.body.append(form); form.submit(); form.remove();
}
async function removeFiles(list){
  const one = list.length === 1;
  const ok = await ask({title: one ? 'Delete this file?' : 'Delete '+list.length+' files?',
    body: one ? '“'+list[0].name+'” will be permanently removed from the server.' : 'They will be permanently removed from the server.',
    ok:'Delete', danger:true});
  if (!ok) return false;
  let failed = 0;
  for (const f of list) {
    try { await api('/api/files/'+f.id, {method:'DELETE'}); selected.delete(f.id); } catch (e) { failed++; }
  }
  toast(failed ? failed+' could not be deleted' : (one ? 'File deleted' : list.length+' files deleted'), failed ? 'err' : '');
  await refresh();
  return true;
}
const bulkDelete = () => removeFiles(files.filter(f => selected.has(f.id)));
async function renameFile(f){
  const v = await ask({title:'Rename file', input:f.name, ok:'Rename'});
  if (!v || !v.trim() || v === f.name) return null;
  try {
    const nf = await api('/api/files/'+f.id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:v})});
    toast('Renamed'); await refresh(); return nf;
  } catch (e) { toast(e.message,'err'); return null; }
}

/* ---------- dialogs ---------- */
function ask({title, body, input, ok='OK', danger=false}){
  return new Promise(resolve => {
    const d = $('#dlg');
    const inp = input != null ? h('input',{class:'field',value:input,'aria-label':title}) : null;
    d.replaceChildren(h('form',{method:'dialog',class:'dlg-body'},
      h('h3',{text:title}), body ? h('p',{text:body}) : null, inp,
      h('div',{class:'end'},
        h('button',{class:'btn '+(danger?'danger':'primary'),value:'ok',text:ok}),
        h('button',{class:'btn',value:'cancel',formnovalidate:true,text:'Cancel'}))));
    d.returnValue = '';
    d.onclose = () => resolve(d.returnValue === 'ok' ? (inp ? inp.value : true) : null);
    d.showModal();
    if (inp) { inp.focus(); const dot = inp.value.lastIndexOf('.'); inp.setSelectionRange(0, dot > 0 ? dot : inp.value.length); }
  });
}
/* Esc fades the dialog out like every other way of closing it */
for (const id of ['#dlg', '#viewer']) { const d = $(id); d.addEventListener('cancel', e => { e.preventDefault(); d.close(); }); }

/* ---------- viewer ---------- */
let vList = [], vIdx = 0, vToken = 0, vStep = 0;
function openViewer(list, i){ clearTimeout(vStep); vStep = 0; vList = list; vIdx = i; renderViewer(); if (!$('#viewer').open) $('#viewer').showModal(); }
/* Next / previous file: the picture on screen slides out, then the new one slides in from that side. */
function stepViewer(d){
  if (vList.length < 2) return;
  vIdx = (vIdx + d + vList.length) % vList.length;
  const st = $('#viewer .stage');
  if (REDUCE || !st) { renderViewer(d); return; }
  st.classList.remove('in-fwd', 'in-back');
  st.classList.add(d > 0 ? 'out-fwd' : 'out-back');
  clearTimeout(vStep);
  vStep = setTimeout(() => { vStep = 0; renderViewer(d); }, 120); // quick presses in a row: only the last one is drawn
}

async function renderViewer(dir){
  const f = vList[vIdx], k = kindOf(f), kind = previewOf(f), token = ++vToken;
  const v = $('#viewer');
  const stage = h('div',{class:'stage k-'+k+(dir && !REDUCE ? (dir > 0 ? ' in-fwd' : ' in-back') : '')});
  if (vList.length > 1) stage.append(
    h('button',{class:'navbtn l',title:'Previous (←)',onclick:()=>stepViewer(-1)}, ic('left')),
    h('button',{class:'navbtn r',title:'Next (→)',onclick:()=>stepViewer(1)}, ic('right')));
  if (vList.length > 1) { // phone: swipe sideways to the next / previous file (not over things that scroll or play)
    let sx = null, sy = 0, st = 0;
    stage.addEventListener('touchstart', e => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); } else sx = null; }, {passive:true});
    stage.addEventListener('touchend', e => {
      if (sx == null || !PHONE.matches || e.target.closest('.tbl,pre,video,audio,iframe,.navbtn')) { sx = null; return; }
      const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 600) stepViewer(dx < 0 ? 1 : -1);
    }, {passive:true});
  }
  stage.addEventListener('click', e => { if (PHONE.matches && e.target.closest('img')) $('#viewer').classList.toggle('bare'); }); // tap the picture: hide / show the buttons
  const fallback = msg => { stage.querySelectorAll('.pv').forEach(e => e.remove()); stage.append(h('div',{class:'noprev pv'}, h('div',{class:'tile'}, ic(k)), h('div',{text:msg}))); };

  if (kind === 'image') {
    const im = h('img',{class:'pv',alt:f.name,src:rawUrl(f)});
    im.onload = () => im.classList.add('ld'); // fades in once it has loaded
    im.onerror = () => fallback("Your browser can't display this image type.");
    if (im.complete && im.naturalWidth) im.classList.add('ld');
    stage.append(im);
  }
  else if (kind === 'video') { const vd = h('video',{class:'pv fadein',controls:true,preload:'metadata',src:rawUrl(f)}); vd.onerror = () => fallback("Your browser can't play this video format. Download it instead."); stage.append(vd); }
  else if (kind === 'audio') { const a = h('audio',{class:'pv',controls:true,preload:'metadata',src:rawUrl(f),style:'width:min(520px,90%)'}); a.onerror = () => fallback("Your browser can't play this audio format."); stage.append(h('div',{class:'noprev'}, h('div',{class:'tile'}, ic(k)), a)); }
  else if (kind === 'pdf') stage.append(h('iframe',{class:'pv fadein',src:rawUrl(f),title:f.name}));
  else if (kind === 'text' || kind === 'table') {
    stage.append(h('div',{class:'loading pv'}, h('i')));
    loadText(f, kind, stage, token, fallback);
  } else fallback('No preview for this file type — you can still download it.');

  const info = h('aside',{class:'info'},
    h('dl',{},
      h('div',{}, h('dt',{text:'Size'}), h('dd',{text:fmtBytes(f.size)+' ('+f.size.toLocaleString()+' bytes)'})),
      h('div',{}, h('dt',{text:'Type'}), h('dd',{text:f.mime})),
      isWa(f) ? h('div',{}, h('dt',{text:'Source'}), h('dd',{text:'WhatsApp'})) : null,
      h('div',{}, h('dt',{text:'Uploaded'}), h('dd',{text:fmtFull(f.created)})),
      h('div',{}, h('dt',{text:'SHA-256 (click to copy)'}), h('dd',{class:'mono',text:f.sha256,onclick:async e=>{ try { await navigator.clipboard.writeText(f.sha256); toast('Checksum copied'); } catch { toast('Copy not available','err'); } }}))),
    h('div',{class:'btns'},
      h('button',{class:'btn primary',onclick:()=>download(f)}, ic('download'), 'Download'),
      h('button',{class:'btn',onclick:async()=>{ const nf = await renameFile(f); if (nf) { const i = vList.findIndex(x=>x.id===f.id); if (i>=0) vList[i] = nf; renderViewer(); } }}, ic('edit'), 'Rename'),
      h('button',{class:'btn',style:'color:var(--danger)',onclick:async()=>{ const gone = await removeFiles([f]); if (gone) { vList.splice(vIdx,1); if (!vList.length) v.close(); else { vIdx = Math.min(vIdx, vList.length-1); renderViewer(); } } }}, ic('trash'), 'Delete')));

  v.replaceChildren(
    h('div',{class:'vbar'}, h('div',{class:'tile k-'+k,style:'width:32px;height:32px'}, ic(k)),
      h('div',{class:'name',title:f.name,text:f.name}),
      h('span',{class:'sub',text:(vIdx+1)+' / '+vList.length}),
      h('button',{class:'btn ghost icon sm',title:'Download',onclick:()=>download(f)}, ic('download')),
      h('button',{class:'btn ghost icon sm',title:'Close (Esc)',onclick:()=>v.close()}, ic('x'))),
    h('div',{class:'vbody'}, stage, info));
}

async function loadText(f, kind, stage, token, fallback){
  const LIMIT = 256*1024;
  try {
    const r = await fetch(rawUrl(f,true), {headers:{Range:'bytes=0-'+(LIMIT-1)}, credentials:'same-origin'});
    if (!r.ok && r.status !== 206) throw new Error();
    let text = new TextDecoder('utf-8').decode(await r.arrayBuffer());
    if (token !== vToken) return;
    const truncated = f.size > LIMIT;
    stage.querySelectorAll('.pv').forEach(e => e.remove());
    let node;
    if (kind === 'table') {
      const rows = parseCSV(text, extOf(f.name)==='tsv' ? '\t' : ',', 300);
      node = h('div',{class:'tbl pv fadein'}, tableOf(rows));
    } else {
      if (!truncated && extOf(f.name) === 'json') { try { text = JSON.stringify(JSON.parse(text), null, 2); } catch {} }
      node = h('pre',{class:'pv fadein',text});
    }
    stage.append(node);
    if (truncated) stage.append(h('div',{class:'note pv',text:'Showing the first '+fmtBytes(LIMIT)+' of '+fmtBytes(f.size)}));
  } catch { if (token === vToken) fallback("Couldn't load a preview."); }
}
function parseCSV(text, sep, maxRows){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length && rows.length < maxRows; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += c;
  }
  if (rows.length < maxRows && (cell || row.length)) { row.push(cell); rows.push(row); }
  return rows;
}
function tableOf(rows){
  if (!rows.length) return h('div',{class:'noprev',text:'This file is empty.'});
  const cols = Math.max(...rows.map(r => r.length));
  const pad = r => Array.from({length:cols}, (_,i) => r[i] ?? '');
  return h('table',{},
    h('thead',{}, h('tr',{}, h('th',{text:'#'}), pad(rows[0]).map(c => h('th',{text:c,title:c})))),
    h('tbody',{}, rows.slice(1).map((r,i) => h('tr',{}, h('td',{text:String(i+1)}), pad(r).map(c => h('td',{text:c,title:c}))))));
}
$('#viewer').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#viewer').addEventListener('close', () => { vToken++; clearTimeout(vStep); vStep = 0; $('#viewer').classList.remove('bare'); $('#viewer').replaceChildren(); });

/* ---------- uploads ---------- */
const jobs = []; let jobSeq = 0, running = 0;
const MAX_PARALLEL = 3;
function enqueue(list){
  let n = 0;
  for (const file of list) {
    if (maxBytes && file.size > maxBytes) { toast(file.name+' is over the '+fmtBytes(maxBytes)+' limit','err'); continue; }
    const j = {id:++jobSeq, file, state:'queued', loaded:0, t0:0, xhr:null, error:'', el:null};
    j.el = h('div',{class:'job'}); jobs.push(j); $('#ujobs').append(j.el); paintJob(j); n++;
  }
  if (n) $('#uploads').hidden = false;
  pump();
}
function pump(){
  while (running < MAX_PARALLEL) { const j = jobs.find(x => x.state === 'queued'); if (!j) break; start(j); }
  const active = jobs.filter(j => j.state==='queued' || j.state==='uploading').length;
  $('#upTitle').textContent = active ? 'Uploading '+active+' file'+(active>1?'s':'')+'…' : 'Uploads';
}
function start(j){
  j.state = 'uploading'; running++; j.t0 = performance.now();
  const x = new XMLHttpRequest(); j.xhr = x;
  x.open('POST','/api/upload');
  x.setRequestHeader('X-Filename', encodeURIComponent(j.file.name));
  x.setRequestHeader('Content-Type', j.file.type || 'application/octet-stream');
  x.upload.onprogress = e => { j.loaded = e.loaded; paintJob(j); };
  x.onload = () => {
    running--;
    if (x.status === 201) { j.state = 'done'; j.loaded = j.file.size; scheduleRefresh(); setTimeout(()=>dismiss(j), 4000); }
    else {
      j.state = 'error';
      try { j.error = JSON.parse(x.responseText).error; } catch { j.error = 'Server said '+x.status; }
      if (x.status === 401) showLogin();
    }
    paintJob(j); pump();
  };
  x.onerror = () => { running--; j.state = 'error'; j.error = 'Network error'; paintJob(j); pump(); };
  x.onabort = () => { running--; j.state = 'cancelled'; paintJob(j); pump(); setTimeout(()=>dismiss(j), 800); };
  x.send(j.file); paintJob(j);
}
function dismiss(j){
  if (j.state==='uploading' || j.state==='queued') return;
  j.el.remove(); const i = jobs.indexOf(j); if (i >= 0) jobs.splice(i,1);
  if (!jobs.length) $('#uploads').hidden = true;
}
function cancel(j){ if (j.state==='uploading') j.xhr.abort(); else if (j.state==='queued') { j.state='cancelled'; dismiss(j); pump(); } }
function retry(j){ j.state = 'queued'; j.loaded = 0; j.error = ''; paintJob(j); pump(); }
function updateOverall(){
  let tot = 0, got = 0;
  for (const j of jobs) if (j.state !== 'cancelled') { tot += j.file.size; got += j.state === 'done' ? j.file.size : j.loaded; }
  const active = jobs.some(j => j.state === 'queued' || j.state === 'uploading');
  $('#upProg').style.width = (active && tot ? Math.round(got / tot * 100) : 100) + '%';
}
function paintJob(j){
  const pct = j.file.size ? Math.round(j.loaded / j.file.size * 100) : (j.state==='done' ? 100 : 0);
  let status;
  if (j.state==='queued') status = 'Waiting…';
  else if (j.state==='uploading') {
    const sec = (performance.now() - j.t0) / 1000, rate = sec > 0.3 ? j.loaded / sec : 0;
    status = pct+'% · '+fmtBytes(j.loaded)+' of '+fmtBytes(j.file.size)+(rate ? ' · '+fmtBytes(rate)+'/s' : '');
  } else if (j.state==='done') status = 'Uploaded · '+fmtBytes(j.file.size);
  else if (j.state==='cancelled') status = 'Cancelled';
  else status = j.error || 'Failed';
  j.el.className = 'job'+(j.state==='done'?' done':'')+(j.state==='error'?' err':'');
  j.el.replaceChildren(
    h('div',{class:'t'}, h('div',{class:'name',title:j.file.name,text:j.file.name}),
      j.state==='error' ? h('button',{class:'btn ghost icon sm',title:'Retry',onclick:()=>retry(j)}, ic('refresh')) : null,
      h('button',{class:'btn ghost icon sm',title: j.state==='uploading'||j.state==='queued' ? 'Cancel':'Dismiss',onclick:()=> (j.state==='uploading'||j.state==='queued') ? cancel(j) : dismiss(j)}, ic('x'))),
    j.state==='error' ? null : h('div',{class:'bar'}, h('i',{style:'width:'+pct+'%'})),
    h('div',{class:'s',text:status}));
  updateOverall();
}

/* drag & drop (files and whole folders) */
async function collectFiles(dt){
  const entries = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  async function walk(en){
    if (en.isFile) await new Promise(r => en.file(f => { out.push(f); r(); }, r));
    else if (en.isDirectory) {
      const rd = en.createReader(); let batch;
      do { batch = await new Promise(r => rd.readEntries(r, () => r([]))); for (const c of batch) await walk(c); } while (batch.length);
    }
  }
  for (const en of entries) await walk(en);
  return out;
}
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
let depth = 0;
addEventListener('dragenter', e => { if (hasFiles(e) && $('#login').hidden) { e.preventDefault(); depth++; $('#overlay').classList.add('on'); } });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave', e => { if (hasFiles(e)) { depth = Math.max(0, depth-1); if (!depth) $('#overlay').classList.remove('on'); } });
addEventListener('drop', async e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); depth = 0; $('#overlay').classList.remove('on');
  if ($('#login').hidden) enqueue(await collectFiles(e.dataTransfer));
});
addEventListener('beforeunload', e => { if (jobs.some(j => j.state==='uploading' || j.state==='queued')) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- login ---------- */
function showLogin(){ $('#login').hidden = false; setTimeout(()=>$('#pw').focus(), 50); }
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginErr').textContent = '';
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:$('#pw').value}), credentials:'same-origin'});
    if (!r.ok) throw new Error((await r.json()).error || 'Login failed');
    $('#pw').value = ''; $('#login').hidden = true; await refresh();
  } catch (err) { $('#loginErr').textContent = err.message; }
});
$('#logout').addEventListener('click', async () => { await fetch('/api/logout', {method:'POST', credentials:'same-origin'}); files = []; stats = null; firstPaint = true; render(); showLogin(); });

/* ---------- wiring ---------- */
function setTheme(t){ document.documentElement.dataset.theme = t; store.set('theme', t); $('#theme').replaceChildren(ic(t==='dark' ? 'sun' : 'moon')); }
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

$('#logo').append(ic('box')); $('#loginIcon').append(ic('lock')); $('#dropIcon').append(ic('upload'));
$('#chatsBtn').prepend(ic('chat')); $('#searchIcon').append(ic('search')); $('#ovIcon').append(ic('upload')); $('#logout').append(ic('logout'));
/* Chats slides in from the right. Plain link behaviour is kept for new-tab clicks and while uploads run (leaving stops them anyway). */
$('#chatsBtn').addEventListener('click', e => {
  if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
  if (jobs.some(j => j.state==='uploading' || j.state==='queued')) return;
  e.preventDefault(); goChats();
});
if (window.StashApp) { const b = $('#appBtn'); b.hidden = false; b.append(ic('sliders')); b.onclick = () => StashApp.openSettings(); }  // only inside the Android app
$('#upClear').append(ic('x')); $('#upClear').onclick = () => jobs.slice().forEach(dismiss);
$('#uploadBtn').append(ic('upload'), 'Upload');
$('#vGrid').append(ic('grid')); $('#vList').append(ic('list'));
$('#searchBtn').append(ic('search')); $('#searchX').append(ic('x')); $('#moreBtn').append(ic('more')); $('#viewBtn').append(ic('sliders')); $('#fab').append(ic('plus'));
if (PHONE.matches) $('#q').placeholder = 'Search files';

const pick = () => $('#picker').click();
$('#uploadBtn').onclick = pick;
$('#drop').onclick = pick;
$('#drop').onkeydown = e => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); pick(); } };
$('#picker').onchange = e => { enqueue([...e.target.files]); e.target.value = ''; };
$('#q').oninput = e => { query = e.target.value; renderBulk(); renderFiles(); };
$('#sort').value = sortBy;
$('#sort').onchange = e => { sortBy = e.target.value; store.set('sort', sortBy); renderFiles(); };
$('#srcSel').value = srcMode;
$('#srcSel').onchange = e => setSrc(e.target.value);
const setView = v => { view = v; store.set('view', view); renderFiles(); };
$('#vGrid').onclick = () => setView('grid');
$('#vList').onclick = () => setView('list');

/* ---------- phone controls ---------- */
const hdr = $('header.top');
const SOURCES = [['all','All files'],['wa','WhatsApp only'],['other','Hide WhatsApp']];
const SORTS = [['new','Newest first'],['old','Oldest first'],['az','Name A–Z'],['za','Name Z–A'],['big','Largest first'],['small','Smallest first']];
function closeMenu(){ $('#menu').hidden = true; $('#menuShade').hidden = true; }
function openMenu(anchor, items){
  const m = $('#menu');
  m.replaceChildren(...items.map(it => it.head ? h('div',{class:'hd',text:it.head}) :
    h('button',{type:'button',role:'menuitem',class:it.on?'on':'',style:it.danger?'color:var(--danger)':null,onclick:()=>{ closeMenu(); it.run(); }},
      it.icon ? ic(it.icon) : null, it.label, it.on ? h('span',{class:'chk'}, ic('check')) : null)));
  m.hidden = false; $('#menuShade').hidden = false;
  const r = anchor.getBoundingClientRect();
  m.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 8)) + 'px';
  m.style.right = Math.max(8, innerWidth - r.right) + 'px';
}
$('#menuShade').onclick = closeMenu;
$('#viewBtn').onclick = e => openMenu(e.currentTarget, [
  {head:'View'},
  {label:'Grid', icon:'grid', on:view==='grid', run:() => setView('grid')},
  {label:'List', icon:'list', on:view==='list', run:() => setView('list')},
  {head:'Sort'},
  ...SORTS.map(([k,l]) => ({label:l, on:sortBy===k, run:() => { sortBy = k; store.set('sort', k); $('#sort').value = k; renderFiles(); }})),
  ...(hasWa ? [{head:'Show'}, ...SOURCES.map(([k,l]) => ({label:l, on:srcMode===k, run:() => setSrc(k)}))] : [])]);
$('#moreBtn').onclick = e => {
  const dark = document.documentElement.dataset.theme === 'dark', items = [];
  if (window.StashApp) items.push({label:'Phone backup & settings', icon:'sliders', run:() => StashApp.openSettings()});
  items.push({label: dark ? 'Light mode' : 'Dark mode', icon: dark ? 'sun' : 'moon', run:() => $('#theme').click()});
  if (!$('#logout').hidden) items.push({label:'Log out', icon:'logout', run:() => $('#logout').click()});
  openMenu(e.currentTarget, items);
};
$('#searchBtn').onclick = () => { hdr.classList.add('searching'); $('#q').focus(); };
$('#searchX').onclick = () => { $('#q').value = ''; query = ''; hdr.classList.remove('searching'); renderBulk(); renderFiles(); };
$('#fab').onclick = () => $('#picker').click();
$('#uploads > header').addEventListener('click', e => { if (PHONE.matches && !e.target.closest('#upClear')) $('#uploads').classList.toggle('open'); });
PHONE.addEventListener('change', () => { closeMenu(); hdr.classList.remove('searching'); render(); });

/* long press selects a file (then a tap adds or removes more). A tap alone opens it. */
let lp = null, lpSwallow = false;
const lpEnd = () => { if (lp) { clearTimeout(lp.timer); lp = null; } };
$('#files').addEventListener('touchstart', e => {
  lpSwallow = false; lpEnd();
  if (!PHONE.matches || e.touches.length !== 1) return;
  const t = e.target.closest('[data-id]'); if (!t) return;
  const id = t.dataset.id, x = e.touches[0].clientX, y = e.touches[0].clientY;
  lp = {x, y, timer: setTimeout(() => { lp = null; lpSwallow = true; try { navigator.vibrate && navigator.vibrate(12); } catch {} toggleSel(id); }, 420)};
}, {passive:true});
$('#files').addEventListener('touchmove', e => { if (lp && (Math.abs(e.touches[0].clientX - lp.x) > 10 || Math.abs(e.touches[0].clientY - lp.y) > 10)) lpEnd(); }, {passive:true});
$('#files').addEventListener('touchend', lpEnd, {passive:true});
$('#files').addEventListener('touchcancel', lpEnd, {passive:true});
$('#files').addEventListener('click', e => { if (lpSwallow) { lpSwallow = false; e.stopPropagation(); e.preventDefault(); } }, true); // the lift after a long press is not a tap
$('#files').addEventListener('contextmenu', e => { if (PHONE.matches) e.preventDefault(); });

/* The Android app's Back button / gesture asks this first: close what is open on the page, one thing per press. */
window.stashBack = function () {
  if (!$('#menu').hidden) { closeMenu(); return true; }
  if (hdr.classList.contains('searching')) { $('#searchX').click(); return true; }
  if (selected.size) { selected.clear(); render(); return true; }
  return false;
};

addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ($('#viewer').open && !$('#dlg').open) {
    if (e.key === 'ArrowLeft') { stepViewer(-1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { stepViewer(1); e.preventDefault(); }
  } else if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; query = ''; $('#q').blur(); hdr.classList.remove('searching'); renderFiles(); }
});

(async function boot(){
  try {
    const wait = afterSlide();
    busy(1);
    let s;
    try { s = await (await fetch('/api/session', {credentials:'same-origin'})).json(); } finally { busy(-1); }
    maxBytes = s.maxBytes; authRequired = s.authRequired;
    $('#logout').hidden = !authRequired;
    if (authRequired && !s.authed) { showLogin(); return; }
    await refresh(wait);
  } catch { toast("Can't reach the server",'err'); }
  finally { hideSplash(); }
})();
</script>
