}

<main>
  <header>
    <h1>Stash architecture</h1>
    <p class="lede">Browser at the top, server in the middle, files, thumbnails and chat snapshots on disk at the bottom. Clients only talk to the server's API, and only the server touches the data.</p>
    <div class="bar">
      <div class="chips" role="group" aria-label="Highlight a path through the system">
        <button class="chip" type="button" data-flow="all" aria-pressed="true">Everything</button>
        <button class="chip" type="button" data-flow="login" aria-pressed="false">Login</button>
        <button class="chip" type="button" data-flow="upload" aria-pressed="false">Upload</button>
        <button class="chip" type="button" data-flow="download" aria-pressed="false">Download and preview</button>
        <button class="chip" type="button" data-flow="manage" aria-pressed="false">Rename and delete</button>
        <button class="chip" type="button" data-flow="backup" aria-pressed="false">Phone backup</button>
        <button class="chip" type="button" data-flow="chats" aria-pressed="false">WhatsApp chats</button>
      </div>
      <div class="legend"><span><i class="sw"></i>exists today</span><span><i class="sw d"></i>planned, not built</span></div>
    </div>
    <p class="note" id="note" aria-live="polite"></p>
  </header>

  <div class="canvas" tabindex="0" role="region" aria-label="Architecture diagram. Scrolls sideways on small screens.">
    <svg id="dia" viewBox="0 0 1400 1160" role="img" aria-labelledby="dia-t dia-d">
      <title id="dia-t">Stash architecture</title>
      <desc id="dia-d">The browser front-end (index.html and chats.html) and Android app call the server's API over HTTP. The server's router passes requests to Auth, the File service (server.py), and the Chat service (chats.py), which read and write stash.db, thumbs, blobs, tmp, chats snapshots, secret.key, and api.key on disk without crossing paths.</desc>
    </svg>
  </div>
</main>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';

  var ALL = 'login upload download manage chats';
  var BK = ALL + ' backup';
  var seed = 20261115;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function jit(a) { return (rnd() - 0.5) * 2 * a; }
  function n(v) { return v.toFixed(1); }

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }
  function grp(flows, cls, parent) {
    var a = { 'class': (flows ? 'it ' : '') + (cls || '') };
    if (flows) a['data-f'] = flows;
    return el('g', a, parent);
  }

  /* a rounded rectangle drawn like a pen would: slightly bowed sides, corners that do not quite meet */
  function rr(x, y, w, h, r, a) {
    r = Math.min(r, w / 2, h / 2);
    function p(px, py) { return n(px + jit(a * 0.5)) + ' ' + n(py + jit(a * 0.5)); }
    function side(ax, ay, bx, by) {
      var horiz = ay === by;
      var cx = (ax + bx) / 2 + (horiz ? 0 : jit(a));
      var cy = (ay + by) / 2 + (horiz ? jit(a) : 0);
      return 'Q ' + n(cx) + ' ' + n(cy) + ' ' + p(bx, by);
    }
    function corner(cx, cy, ex, ey) { return 'Q ' + n(cx) + ' ' + n(cy) + ' ' + p(ex, ey); }
    return 'M ' + p(x + r, y) + ' ' +
      side(x + r, y, x + w - r, y) + ' ' + corner(x + w, y, x + w, y + r) + ' ' +
      side(x + w, y + r, x + w, y + h - r) + ' ' + corner(x + w, y + h, x + w - r, y + h) + ' ' +
      side(x + w - r, y + h, x + r, y + h) + ' ' + corner(x, y + h, x, y + h - r) + ' ' +
      side(x, y + h - r, x, y + r) + ' ' + corner(x, y, x + r, y);
  }

  function box(x, y, w, h, o) {
    o = o || {};
    var g = grp(o.flows, null, null);
    var r = o.r == null ? 12 : o.r;
    if (o.fill) el('rect', { x: x, y: y, width: w, height: h, rx: r, 'class': o.fill }, g);
    var amp = o.amp || Math.min(2.4, Math.max(1, Math.min(w, h) / 70));
    el('path', { d: rr(x, y, w, h, r, amp), 'class': 'ln' + (o.fut ? ' fut' : '') }, g);
    if (!o.fut) el('path', { d: rr(x, y, w, h, r, amp * 0.9), 'class': 'ln b' }, g);
    return g;
  }

  function tx(x, y, lines, cls, parent, lh) {
    var t = el('text', { x: x, y: y, 'class': 't ' + (cls || '') }, parent);
    (Array.isArray(lines) ? lines : [lines]).forEach(function (l, i) {
      var s = el('tspan', { x: x, dy: i ? (lh || 22) : 0 }, t);
      s.textContent = l.replace(/ {2,}|^ /g, function (m) { return ' '.repeat(m.length); });
    });
    return t;
  }

  function head(x, y, dx, dy, parent, fut) {
    var L = 12, ang = 0.52;
    function rot(vx, vy, a) { return [vx * Math.cos(a) - vy * Math.sin(a), vx * Math.sin(a) + vy * Math.cos(a)]; }
    var a = rot(-dx, -dy, ang), b = rot(-dx, -dy, -ang);
    el('path', {
      d: 'M ' + n(x + a[0] * L) + ' ' + n(y + a[1] * L) + ' L ' + n(x) + ' ' + n(y) + ' L ' + n(x + b[0] * L) + ' ' + n(y + b[1] * L),
      'class': 'ln' + (fut ? ' fut' : ''), style: fut ? 'stroke-dasharray:none' : ''
    }, parent);
  }

  /* an elbow arrow through the given points; both = arrowhead at each end */
  function arrow(pts, o) {
    o = o || {};
    var g = grp(o.flows, 'arrow', null);
    var d = 'M ' + n(pts[0][0] + jit(0.8)) + ' ' + n(pts[0][1] + jit(0.8));
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i];
      d += ' Q ' + n((a[0] + b[0]) / 2 + jit(1.4)) + ' ' + n((a[1] + b[1]) / 2 + jit(1.4)) + ' ' +
           n(b[0] + jit(0.8)) + ' ' + n(b[1] + jit(0.8));
    }
    el('path', { d: d, 'class': 'ln' + (o.fut ? ' fut' : '') }, g);
    var L = pts.length;
    function unit(ax, ay, bx, by) { var dx = bx - ax, dy = by - ay, m = Math.hypot(dx, dy) || 1; return [dx / m, dy / m]; }
    var u = unit(pts[L - 2][0], pts[L - 2][1], pts[L - 1][0], pts[L - 1][1]);
    head(pts[L - 1][0], pts[L - 1][1], u[0], u[1], g, o.fut);
    if (o.both) {
      var v = unit(pts[1][0], pts[1][1], pts[0][0], pts[0][1]);
      head(pts[0][0], pts[0][1], v[0], v[1], g, o.fut);
    }
    if (o.label) tx(o.label.x, o.label.y, o.label.t, 'lab' + (o.label.end ? ' end' : ''), g);
    return g;
  }

  var m4 = box(290, 176, 180, 34, { fill: 'z-mini', r: 8, amp: 1.2, flows: 'login' });
  tx(380, 199, 'Login screen', 'mid', m4);
  var m5 = box(90, 218, 380, 32, { fill: 'z-mini', r: 8, amp: 1.2, flows: 'chats' });
  tx(280, 240, 'WhatsApp chat viewer + media (chats.html)', 'mid', m5);

  var api = box(570, 100, 330, 145, { fill: 'z-box', flows: BK });
  tx(590, 136, ['File & chat', 'API calls'], 'h2', api, 28);
  tx(590, 196, 'fetch / XHR: JSON and raw file/db/thumb bodies', 'sm', api);
  tx(590, 218, 'login: cookie (web) or API key (app)', 'sm', api);

  arrow([[490, 170], [570, 170]], { both: true, flows: ALL });

  var key = box(65, 915, 135, 145, { fill: 'z-box', flows: BK });

    backup: 'Phone backup: the Android app hashes each new photo/video, asks GET /api/files/by-hash/<sha256> whether the server already has it, uploads with the API key and X-Sha256, and sends a 320 px JPEG preview.',
    manage: 'Rename and delete: a rename only changes stash.db. A delete removes the row, the file in blobs/, and the thumbnail in thumbs/ once no file with that hash remains.',
    chats: 'WhatsApp chats (v1): the Android app decrypts msgstore*.crypt15 on the phone and POSTs the plain SQLite file to /api/chats/import, plus SHA-256-matched chat media with X-Source: whatsapp. chats.py checks the schema, builds an index + .json summary, links media strictly by SHA-256 via vault_lookup(), serves message_thumbnail previews, and powers /chats (chats.html).'
  };
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  var note = document.getElementById('note');
  function setFlow(f) {
    Array.prototype.forEach.call(svg.querySelectorAll('.it'), function (e) {
      var on = f === 'all' || e.getAttribute('data-f').split(' ').indexOf(f) >= 0;
      e.classList.toggle('dim', !on);
      e.classList.toggle('on', on && f !== 'all');
    });
    chips.forEach(function (c) { c.setAttribute('aria-pressed', String(c.getAttribute('data-flow') === f)); });
    note.textContent = texts[f];
  }
  chips.forEach(function (c) { c.addEventListener('click', function () { setFlow(c.getAttribute('data-flow')); }); });
  setFlow('all');
})();
</script>
